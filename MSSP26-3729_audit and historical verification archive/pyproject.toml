[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgmarl-manuscript"
version = "0.1.0"
description = "Manuscript-aligned PG-MARL reference implementation"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
include = ["pgmarl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
